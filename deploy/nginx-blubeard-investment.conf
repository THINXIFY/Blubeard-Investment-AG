# Dedicated server blocks for this site only. Installed by deploy/server-setup.sh as
# /etc/nginx/sites-available/blubeard-investment. Canonical address: https://www.blubeard-investment.com

server {
    listen 80;
    server_name blubeard-investment.com www.blubeard-investment.com;

    # Let's Encrypt renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blubeard-investment/acme;
    }

    location / {
        return 301 https://www.blubeard-investment.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name blubeard-investment.com;

    ssl_certificate /etc/letsencrypt/live/blubeard-investment/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blubeard-investment/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.blubeard-investment.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.blubeard-investment.com;

    ssl_certificate /etc/letsencrypt/live/blubeard-investment/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blubeard-investment/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Not includeSubDomains: other subdomains are outside this site's control.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    access_log /var/log/nginx/blubeard-investment.access.log;
    error_log /var/log/nginx/blubeard-investment.error.log;

    location / {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        # Required: the document API compares Origin with Host, and rate limits use the client address.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The documents email can take a while to send.
        proxy_read_timeout 75s;
    }
}
